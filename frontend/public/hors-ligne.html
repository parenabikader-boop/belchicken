<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a140e">
<meta name="robots" content="noindex">
<title>Pas de connexion · Belchicken</title>
<!-- Affichée par le service worker (sw.js) quand le téléphone est hors ligne.
     Tout est dans ce fichier : il doit s'afficher sans internet. -->
<style>
  :root{--brand:#a3161b;--bg:#fbf6ef;--ink:#2a140e;--muted:#6b5249;--gold:#f2b705}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
    font-family:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;text-align:center}
  .card{max-width:380px}
  img{width:112px;height:112px;border-radius:22px;display:block;margin:0 auto 22px}
  h1{font-size:26px;line-height:1.2;margin:0 0 10px}
  p{color:var(--muted);font-size:16px;line-height:1.55;margin:0 0 24px}
  button{font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--brand);border:0;border-radius:6px;padding:14px 28px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <img id="logo" src="/icons/client-192.png" alt="Belchicken">
  <h1>Pas de connexion</h1>
  <p>Votre téléphone n'est pas connecté à internet. Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div>
<script>
  if (location.pathname.indexOf('/equipe') === 0) document.getElementById('logo').src = '/icons/equipe-192.png';
  // La connexion revient : la page demandée s'ouvre toute seule
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
