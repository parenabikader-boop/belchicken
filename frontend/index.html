<!DOCTYPE html>

<head>

<link rel="icon" type="image/png" href="/icons/favicon-48.png">
<!-- Application installable : « Belchicken » (clients) ou « Belchicken Équipe » (sous /equipe).
     Le choix se fait dès l'ouverture, voir aussi src/pwa.js. -->
<link rel="manifest" id="pwa-manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" id="pwa-apple-icon" href="/icons/client-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" id="pwa-apple-title" content="Belchicken">
<script>
  if (/^\/equipe(\/|$)/.test(location.pathname)) {
    document.getElementById('pwa-manifest').href = '/equipe.webmanifest';
    document.getElementById('pwa-apple-icon').href = '/icons/equipe-apple-180.png';
    document.getElementById('pwa-apple-title').content = 'BC Équipe';
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
